name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java services (Maven + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build, test, and aggregate coverage
        run: mvn -B verify
      - name: Upload JaCoCo aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: services/coverage-report/target/site/jacoco-aggregate
          if-no-files-found: ignore

  typescript:
    name: TypeScript (Jest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [notification-service, card-management-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [fraud-detection, fee-engine]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
